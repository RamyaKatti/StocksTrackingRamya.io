<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Stock Monitor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold">📈 Live Stock Watchlist</h1>
            <span class="text-sm text-gray-400">Refreshes every 60 seconds</span>
        </header>

        <!-- This container is where your stock cards will automatically appear -->
        <div id="watchlist-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </div>

    <script>
        // 1. ADD YOUR FINNHUB API KEY HERE
        const API_KEY = 'YOUR_FINNHUB_API_KEY'; 

        // 2. DEFINE YOUR WATCHLIST
        // Note: Finnhub uses standard formats like 'TCS.NS' for Indian markets or 'AAPL' for US markets
        const watchlist = ['TCS.NS', 'AAPL', 'TSLA', 'MSFT', 'AMZN'];

        // Function to create an empty loading card layout for each stock
        function initializeDashboard() {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = ''; // Clear previous content

            watchlist.forEach(ticker => {
                const cardHtml = `
                    <div id="card-${ticker.replace('.', '-')}" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 transition duration-200 hover:border-gray-500">
                        <h2 class="text-xl font-bold tracking-wide text-gray-300">${ticker}</h2>
                        <p class="text-3xl font-extrabold mt-3 text-white" id="price-${ticker.replace('.', '-')}">Loading...</p>
                        <span class="text-sm font-semibold mt-1 inline-block" id="change-${ticker.replace('.', '-')}">--</span>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Function to loop through all tickers and grab their current prices
        async function updateAllStocks() {
            for (const ticker of watchlist) {
                // Formatting helper for tickers with dots (like TCS.NS) so HTML handles it properly
                const safeId = ticker.replace('.', '-');
                
                try {
                    const response = await fetch(`https://finnhub.io{ticker}&token=${API_KEY}`);
                    const data = await response.json();
                    
                    // Fallback check if the API returns empty/invalid data for a specific ticker
                    if (data.c === 0 || !data.c) {
                        document.getElementById(`price-${safeId}`).innerText = "Not Found";
                        continue;
                    }

                    // Update UI elements with Finnhub data keys: c = current price, d = change, dp = percent change
                    document.getElementById(`price-${safeId}`).innerText = `$${data.c.toFixed(2)}`;
                    
                    const changeValue = data.d || 0;
                    const changePercent = data.dp || 0;
                    const sign = changeValue >= 0 ? '+' : '';
                    
                    const changeEl = document.getElementById(`change-${safeId}`);
                    changeEl.innerText = `${sign}${changeValue.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                    
                    // Style color based on positive or negative market movement
                    if (changeValue >= 0) {
                        changeEl.className = "text-green-400 text-sm font-semibold mt-1 inline-block";
                    } else {
                        changeEl.className = "text-red-400 text-sm font-semibold mt-1 inline-block";
                    }
                } catch (error) {
                    console.error(`Error updating ticker ${ticker}:`, error);
                    document.getElementById(`price-${safeId}`).innerText = "Error";
                }
            }
        }

        // Initialize empty frames first, then fire the data fetcher
        initializeDashboard();
        updateAllStocks();

        // Refresh numbers automatically once every single minute
        setInterval(updateAllStocks, 60000);
    </script>
</body>
</html>
