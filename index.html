<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free Stock Monitor</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">📈 Stock Watchlist</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Stock Cards Template -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 id="stock-ticker" class="text-xl font-semibold">AAPL (Apple Inc.)</h2>
                <p class="text-4xl font-bold mt-2" id="stock-price">Loading...</p>
                <span id="stock-change" class="text-sm font-medium">--</span>
            </div>
        </div>
    </div>

    <script>
        // Replace with your real Finnhub API key
        const API_KEY = 'YOUR_FINNHUB_API_KEY'; 
        const ticker = 'AAPL';

        async function fetchStock() {
            try {
                const response = await fetch(`https://finnhub.io{ticker}&token=${API_KEY}`);
                const data = await response.json();
                
                // c = Current price, d = Change, dp = Percent change
                document.getElementById('stock-price').innerText = `$${data.c.toFixed(2)}`;
                
                const change = data.d >= 0 ? `+${data.d.toFixed(2)} (${data.dp.toFixed(2)}%)` : `${data.d.toFixed(2)} (${data.dp.toFixed(2)}%)`;
                const changeEl = document.getElementById('stock-change');
                changeEl.innerText = change;
                changeEl.className = data.d >= 0 ? "text-green-400 text-sm font-medium" : "text-red-400 text-sm font-medium";
            } catch (error) {
                console.error("Error fetching stock data:", error);
            }
        }

        fetchStock();
        setInterval(fetchStock, 60000); // Automatically refresh every 60 seconds
    </script>
</body>
</html>
