<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE India Watchlist</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold">🇮🇳 NSE India Stock Watchlist</h1>
                <p class="text-xs text-slate-400 mt-1">Updated automatically via GitHub Actions</p>
            </div>
            <span class="text-sm text-slate-400 bg-slate-800 px-3 py-1 rounded-full" id="update-time">Loading...</span>
        </header>

        <!-- Main Watchlist Container -->
        <div id="watchlist" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Data will be inserted here dynamically -->
        </div>
    </div>

    <script>
        // Fetch the data file generated by our GitHub backend script
        async function loadData() {
            try {
                const response = await fetch('./stocks.json?t=' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('update-time').innerText = "As of: " + data.last_updated;
                
                const container = document.getElementById('watchlist');
                container.innerHTML = '';

                data.stocks.forEach(stock => {
                    const price = parseFloat(stock.price);
                    const change = parseFloat(stock.change);
                    const pct = parseFloat(stock.percent);
                    const isPositive = change >= 0;

                    const card = `
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                            <div class="flex justify-between items-center">
                                <h2 class="text-xl font-bold text-slate-100">${stock.ticker}</h2>
                                <span class="text-xs bg-slate-900 text-slate-400 px-2 py-0.5 rounded">NSE</span>
                            </div>
                            <p class="text-3xl font-extrabold mt-4 text-white">₹${price.toFixed(2)}</p>
                            <span class="text-sm font-semibold mt-1 inline-block ${isPositive ? 'text-green-400' : 'text-red-400'}">
                                ${isPositive ? '+' : ''}${change.toFixed(2)} (${isPositive ? '+' : ''}${pct.toFixed(2)}%)
                            </span>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                document.getElementById('update-time').innerText = "System Initializing. Waiting for first backend run...";
            }
        }
        loadData();
    </script>
</body>
</html>
