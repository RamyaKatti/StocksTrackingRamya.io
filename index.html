<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE India Stock Monitor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold">🇮🇳 NSE India Live Watchlist</h1>
                <p class="text-xs text-slate-400 mt-1">Market Hours: Mon-Fri, 9:15 AM — 3:30 PM IST</p>
            </div>
            <span class="text-sm text-slate-400 bg-slate-800 px-3 py-1 rounded-full" id="update-status">Initializing...</span>
        </header>

        <!-- Container where Indian stock cards populate -->
        <div id="watchlist-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        // 1. PASTE YOUR TWELVEDATA API KEY HERE
        const API_KEY = '68b975c41bdc4606a7a7759be20ddf9e'; 

        // 2. YOUR INDIAN STOCK WATCHLIST (NSE)
        // Feel free to add or change tickers here. Always keep the ':NSE' suffix.
        const watchlist = ['TCS:NSE', 'RELIANCE:NSE', 'INFY:NSE', 'HDFCBANK:NSE', 'TATAMOTORS:NSE'];

        // Build placeholder cards immediately so the screen isn't blank
        function initializeDashboard() {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = ''; 

            watchlist.forEach(ticker => {
                const safeId = ticker.replace(':', '-');
                // Extract clean name for display (e.g., "TCS" instead of "TCS:NSE")
                const displayName = ticker.split(':')[0]; 
                
                const cardHtml = `
                    <div id="card-${safeId}" class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 transition duration-200 hover:border-slate-500">
                        <div class="flex justify-between items-start">
                            <h2 class="text-xl font-bold tracking-wide text-slate-200">${displayName}</h2>
                            <span class="text-xs font-semibold text-slate-500 bg-slate-900 px-2 py-0.5 rounded">NSE</span>
                        </div>
                        <p class="text-3xl font-extrabold mt-4 text-white" id="price-${safeId}">Loading...</p>
                        <span class="text-sm font-semibold mt-1 inline-block" id="change-${safeId}">--</span>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        async function fetchStockData() {
            document.getElementById('update-status').innerText = "Updating values...";
            const symbolsParam = watchlist.join(',');
            
            try {
                const response = await fetch(`https://twelvedata.com{symbolsParam}&apikey=${API_KEY}`);
                const data = await response.json();

                if (data.status === "error") {
                    document.getElementById('update-status').innerText = `API Error: ${data.message}`;
                    return;
                }

                watchlist.forEach(ticker => {
                    const safeId = ticker.replace(':', '-');
                    
                    // Handle single ticker vs multi-ticker data format from Twelve Data
                    const stockData = watchlist.length > 1 ? data[ticker] : data;

                    if (!stockData || stockData.status === "error") {
                        document.getElementById(`price-${safeId}`).innerText = "Not Found";
                        return;
                    }

                    const price = parseFloat(stockData.close);
                    const change = parseFloat(stockData.change);
                    const changePercent = parseFloat(stockData.percent_change);

                    // All prices are now formatted in Indian Rupees (₹)
                    document.getElementById(`price-${safeId}`).innerText = `₹${price.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                    
                    const sign = change >= 0 ? '+' : '';
                    const changeEl = document.getElementById(`change-${safeId}`);
                    changeEl.innerText = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                    
                    // Green for gains, Red for losses
                    if (change >= 0) {
                        changeEl.className = "text-green-400 text-sm font-semibold mt-1 inline-block";
                    } else {
                        changeEl.className = "text-red-400 text-sm font-semibold mt-1 inline-block";
                    }
                });

                const now = new Date();
                document.getElementById('update-status').innerText = `Last updated: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error("Network error:", error);
                document.getElementById('update-status').innerText = "Network Failure.";
            }
        }

        // Run execution sequence
        initializeDashboard();
        fetchStockData();

        // Refresh every 5 minutes to protect your free API limit tier
        setInterval(fetchStockData, 300000); 
    </script>
</body>
</html>
