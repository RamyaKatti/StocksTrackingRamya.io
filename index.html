<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free Global Stock Monitor</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold">📈 Live Global Watchlist</h1>
            <span class="text-sm text-gray-400" id="update-status">Updating...</span>
        </header>

        <!-- Container where stock cards populate -->
        <div id="watchlist-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be dynamically injected here -->
        </div>
    </div>

    <script>
        // DEFINE YOUR WATCHLIST
        // US Stocks: Standard symbols like 'AAPL', 'TSLA'
        // Indian Stocks (NSE): Add the suffix '.NS' like 'TCS.NS', 'RELIANCE.NS'
        const watchlist = ['TCS.NS', 'AAPL', 'TSLA', 'MSFT', 'AMZN'];

        // Build placeholder cards immediately so the screen isn't blank
        function initializeDashboard() {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = ''; 

            watchlist.forEach(ticker => {
                const safeId = ticker.replace('.', '-');
                const cardHtml = `
                    <div id="card-${safeId}" class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 transition duration-200 hover:border-gray-500">
                        <h2 class="text-xl font-bold tracking-wide text-gray-300">${ticker}</h2>
                        <p class="text-3xl font-extrabold mt-3 text-white" id="price-${safeId}">Loading...</p>
                        <span class="text-sm font-semibold mt-1 inline-block" id="change-${safeId}">--</span>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Fetch data using the public Yahoo Finance Open Options endpoint
        async function fetchStockData() {
            document.getElementById('update-status').innerText = "Updating values...";
            
            for (const ticker of watchlist) {
                const safeId = ticker.replace('.', '-');
                try {
                    // Pulls public real-time data structure directly without needing account tokens
                    const response = await fetch(`https://yahoo.com{ticker}`);
                    
                    if (!response.ok) throw new Error("Network issue");
                    
                    const json = await response.json();
                    const quote = json.optionChain.result[0].quote;

                    const price = quote.regularMarketPrice;
                    const change = quote.regularMarketChange;
                    const changePercent = quote.regularMarketChangePercent;
                    const currency = quote.currency || 'USD';

                    // Formatting currency symbols dynamically based on ticker asset properties
                    const currencySymbol = currency === 'INR' ? '₹' : '\$';

                    // Update UI numerical readouts
                    document.getElementById(`price-${safeId}`).innerText = `${currencySymbol}${price.toFixed(2)}`;
                    
                    const sign = change >= 0 ? '+' : '';
                    const changeEl = document.getElementById(`change-${safeId}`);
                    changeEl.innerText = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                    
                    // Assign green or red styling themes based on positive or negative daily market change
                    if (change >= 0) {
                        changeEl.className = "text-green-400 text-sm font-semibold mt-1 inline-block";
                    } else {
                        changeEl.className = "text-red-400 text-sm font-semibold mt-1 inline-block";
                    }
                } catch (error) {
                    console.error(`Failed to load ${ticker}:`, error);
                    document.getElementById(`price-${safeId}`).innerText = "Market Closed / Error";
                    document.getElementById(`change-${safeId}`).className = "text-gray-500 text-sm";
                }
            }
            
            const now = new Date();
            document.getElementById('update-status').innerText = `Last updated: ${now.toLocaleTimeString()}`;
        }

        // Run execution sequence
        initializeDashboard();
        fetchStockData();

        // Automatically pull market changes every 30 seconds
        setInterval(fetchStockData, 30000);
    </script>
</body>
</html>
