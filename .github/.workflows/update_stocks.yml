name: Update Indian Stock Watchlist

on:
  schedule:
    # Runs every 30 minutes, Monday through Friday during Indian market hours
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger an update with a button click

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch Current NSE Data
        run: |
          python -c "
          import yfinance as yf
          import json
          from datetime import datetime
          
          tickers = ['TCS.NS', 'RELIANCE.NS', 'INFY.NS', 'HDFCBANK.NS', 'TATAMOTORS.NS']
          stock_list = []
          
          for t in tickers:
              try:
                  ticker_obj = yf.Ticker(t)
                  info = ticker_obj.fast_info
                  
                  # Extract parameters cleanly
                  current_price = info.last_price
                  prev_close = info.previous_close
                  change = current_price - prev_close
                  pct_change = (change / prev_close) * 100 if prev_close else 0
                  
                  stock_list.append({
                      'ticker': t.replace('.NS', ''),
                      'price': current_price,
                      'change': change,
                      'percent': pct_change
                  })
              except Exception as e:
                  print(f'Error on {t}: {e}')
          
          output = {
              'last_updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S IST'),
              'stocks': stock_list
          }
          
          with open('stocks.json', 'w') as f:
              json.dump(output, f, indent=4)
          "

      - name: Commit and Save Live Data
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 Automator: Updated market figures' && git push)
